version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: gestao-postgres
    environment:
      POSTGRES_USER: gestao_admin
      POSTGRES_PASSWORD: gestao_password
      POSTGRES_DB: gestao_microestrutural
    ports:
      - "5432:5432"
    volumes:
      - gestao-pgdata:/var/lib/postgresql/data
      - ../scripts/init-eventstore.sql:/docker-entrypoint-initdb.d/init-eventstore.sql
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: gestao-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gestao.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    depends_on:
      - postgres-db
    restart: unless-stopped

volumes:
  gestao-pgdata:
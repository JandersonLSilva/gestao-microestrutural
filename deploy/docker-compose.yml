version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: gestao-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - gestao-pgdata:/var/lib/postgresql/data
      - ../scripts/init-eventstore.sql:/docker-entrypoint-initdb.d/init-eventstore.sql
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: gestao-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres-db
    restart: unless-stopped

volumes:
  gestao-pgdata: